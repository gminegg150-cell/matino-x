name: Build MATINO X IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/MATINO X.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -9qry "MATINO X.ipa" Payload
          ls -lh "MATINO X.ipa"

      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="matino-x-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" "build/MATINO X.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MATINO X Build ${GITHUB_RUN_ID}" \
            --notes "Unsigned MATINO X IPA built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
