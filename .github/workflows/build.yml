name: Build MATINO X IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate embedded localization table
        run: |
          python3 generate_embedded_localizations.py
          python3 generate_embedded_localizations.py --check

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Apply VESPER-style IPA structure
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/MATINO X.app"
          EXEC="$APP/MATINO X"
          test -d "$APP"
          test -f "$EXEC"

          # 1. Compile the localization folders out of the bundle: the strings
          #    now live inside the executable as EmbeddedLocalizationCatalog.
          find "$APP" -type d -name '*.lproj' -prune -exec rm -rf {} +
          if find "$APP" -type d -name '*.lproj' -print -quit | grep -q .; then
            echo "Error: an .lproj folder remains inside the app bundle." >&2
            exit 1
          fi

          # 2. Pad the executable to the 400 MiB threshold so the installed
          #    binary size matches the packaging contract used by VESPER.
          printf 'Adding 400 MiB executable padding...\n'
          dd if=/dev/zero bs=1m count=400 >> "$EXEC" 2>/dev/null
          EXEC_BYTES="$(wc -c < "$EXEC" | tr -d ' ')"
          if [ "$EXEC_BYTES" -lt $((400 * 1024 * 1024)) ]; then
            echo "Error: executable is smaller than 400 MiB: $EXEC_BYTES" >&2
            exit 1
          fi
          echo "Executable size: $EXEC_BYTES bytes"
          echo "Verified: .lproj folders removed and 400 MiB padding applied."

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/MATINO X.app"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -9qry "MATINO X.ipa" Payload
          ls -lh "MATINO X.ipa"

      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="matino-x-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" "build/MATINO X.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MATINO X Build ${GITHUB_RUN_ID}" \
            --notes "Unsigned MATINO X IPA built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
